    <title>Renderer sandbox · Forge of Echoes</title>
    <style>
      html,
      body {
        margin: 0;

      #stats {
        position: fixed;
        left: 12px;
        top: 12px;
        margin: 0;
        padding: 6px 10px;

        color: #e8dcc0;
        background: rgba(13, 11, 14, 0.72);
        border: 1px solid #3b3438;
        border-radius: 3px;
        white-space: pre;
        pointer-events: none;
      }
    </style>
