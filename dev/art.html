<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Art Gallery</title>
    <style>
      :root {
        --ink: #0d0b0e;
        --coal: #1a1619;
        --char: #2a2326;
        --iron: #3b3438;
        --stone: #7d7278;
        --bone: #cbbfa8;
        --ember: #e8662a;
        --gold: #e0b04a;
        --font-ui-caption: 14px;
        --font-ui-secondary: 16px;
        --font-ui-body: 19px;
        --font-ui-title: 28px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px 28px 60px;
        background: radial-gradient(ellipse at 50% 0%, #211a1e 0%, var(--ink) 70%);
        background-color: var(--ink);
        color: var(--bone);
        font-family: 'Alegreya Sans', system-ui, sans-serif;
        font-size: var(--font-ui-secondary);
      }
      header { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; margin-bottom: 8px; }
      h1 { font-family: 'Cinzel', Georgia, serif; font-size: var(--font-ui-title); font-weight: 600; margin: 0; letter-spacing: 0.04em; color: var(--gold); }
      h2 {
        font-family: 'Cinzel', Georgia, serif; font-size: var(--font-ui-body); font-weight: 600; margin: 28px 0 10px;
        color: var(--bone); border-bottom: 1px solid var(--iron); padding-bottom: 6px; letter-spacing: 0.06em;
      }
      .meta { font-size: var(--font-ui-caption); color: var(--stone); }
      label.toggle { font-size: var(--font-ui-secondary); color: var(--bone); display: flex; align-items: center; gap: 6px; cursor: pointer; }
      .grid { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
      .card {
        background: linear-gradient(180deg, #1c171a, #141013);
        border: 1px solid #2c2428; border-radius: 3px; padding: 8px 8px 6px;
        display: flex; flex-direction: column; align-items: center; gap: 4px;
      }
      .card canvas { image-rendering: pixelated; display: block; }
      .label { font-size: var(--font-ui-caption); color: var(--bone); white-space: nowrap; }
      .sub { font-size: var(--font-ui-caption); color: var(--stone); white-space: nowrap; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
      .icons { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
      .icons .card { padding: 8px 6px 6px; }
      .icons img { image-rendering: pixelated; display: block; }
      .slot {
        background:
          linear-gradient(#2a232655 1px, transparent 1px) 0 0 / 64px 64px,
          linear-gradient(90deg, #2a232655 1px, transparent 1px) 0 0 / 64px 64px,
          radial-gradient(ellipse at 50% 40%, #241c20, #120e11);
        border: 1px solid #3b3438;
      }
      .floors { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .floors canvas { width: 100%; height: auto; image-rendering: pixelated; border: 1px solid #2c2428; }
      .scene canvas { image-rendering: pixelated; display: block; border: 1px solid #2c2428; }
      .error { color: var(--ember); font-size: var(--font-ui-body); }
      nav.meta { margin: 2px 0 6px; line-height: 1.7; }
      nav a { color: var(--bone); }
      .ok { color: #8fbf7a; }
      .bad { color: var(--ember); }
      .lineup canvas { image-rendering: pixelated; display: block; border: 1px solid #2c2428; }
      .hud { display: inline-flex; gap: 6px; align-items: flex-end; padding: 8px 10px; background: linear-gradient(180deg, #1b1618, #0f0c0e); border: 1px solid var(--iron); }
      .hud .buff { display: flex; flex-direction: column; align-items: center; gap: 2px; }
      .hud img { image-rendering: pixelated; display: block; }
    </style>
  </head>
  <body>
    <header>
      <h1>Forge of Echoes · Procedural Art</h1>
      <span class="meta" id="stats"></span>
      <label class="toggle"><input type="checkbox" id="lit" /> In-game lighting preview (dark ambient + lights + emissive)</label>
      <span class="meta" id="coverage"></span>
    </header>
    <nav class="meta">
      Views (<code>?view=</code>): <a href="?view=lineup">lineup</a> · <a href="?view=hideout">hideout</a> · <a href="?view=scene&amp;scene=all">scene</a> ·
      <a href="?view=sorceress">sorceress</a> · <a href="?view=mirror">mirror</a> · <a href="?view=monsters">monsters</a> ·
      <a href="?view=ossuary">ossuary</a> · <a href="?view=coliseum">coliseum</a> · <a href="?view=proj">proj</a> ·
      <a href="?view=fx">fx</a> · <a href="?view=bfx">bfx</a> · <a href="?view=debuffs">debuffs</a> · <a href="?view=props">props</a> ·
      <a href="?view=drops">drops</a> · <a href="?view=tiles">tiles</a> · <a href="?view=icons">icons</a> · <a href="?view=portrait">portrait</a>
      · workshop pages: <a href="art-ossuary.html">ossuary</a> · <a href="art-coliseum.html">coliseum</a> · <a href="art-bfx.html">bestiary fx</a>
    </nav>
    <main id="app"></main>
    <script type="module">
      // Views: ?view=all (default) or a comma list of: lineup, hideout, scene, sorceress, mirror, monsters, ossuary, coliseum,
      // proj, fx, bfx, debuffs, props, drops, tiles, icons, portrait.
      //   hideout  the hideout stations (stash, Crafting Bench, map device, Rook, brazier, chest) beside the sorceress at
      //            game scale on the hideout floor. ?hscale=3  ?llook=plain,dark,pool  ?lf=<frame>
      //   scene    ?scene=ashenForge|hideout|rimedOssuary|ironColiseum|all  ?lit=1  ?zoom=3 — each theme uses its own roster
      //   lineup   cohesion check: every roster + the sorceress on one baseline on each floor, 1× art shown at ?lscale=3.
      //            ?lanim=idle|move|windup|attack|corpse  ?lf=<frame> freezes (default animates)  ?lfloor=rimedOssuary,…
      //            ?llook=plain,dark,pool (plain albedo · game look outside the light · game look inside a light pool)
      //   monsters / ossuary / coliseum   ?kind=a,b  ?mscale=4  ?strips=0|only
      //   bfx      new projectiles, area visuals and the debuff overlays on the sorceress   debuffs: HUD icons
      import { generateArt, iconPixels, ICON_IDS, debuffOverlayFrame, DEBUFF_PLAYER_TINT, ROOTED_VARIANTS } from '/src/art/index.ts';
      import { ALL_ICON_IDS } from '/src/contracts/content.ts';
      import { REQUIRED_SPRITES } from '/src/contracts/art.ts';
      import { THEME_ROSTER, OSSUARY_MONSTERS, COLISEUM_MONSTERS, NEW_REQUIRED_SPRITES, NEW_PROJECTILE_KINDS, DEBUFF_ICON_IDS, PLAYER_DEBUFFS } from '/src/contracts/bestiary.ts';

      const app = document.getElementById('app');
      const t0 = performance.now();
      const art = generateArt();
      const genMs = performance.now() - t0;
      const t1 = performance.now();
      for (const id of ALL_ICON_IDS) iconPixels(id);
      const iconMs = performance.now() - t1;
      const frames = art.sprites.reduce((n, s) => n + s.frames.length, 0);
      const t2 = performance.now();
      for (const id of DEBUFF_ICON_IDS) iconPixels(id);
      const debuffIconMs = performance.now() - t2;
      document.getElementById('stats').textContent =
        `${art.sprites.length} sprites · ${frames} frames · generated in ${genMs.toFixed(0)} ms · ${ICON_IDS.length} icons in ${(iconMs + debuffIconMs).toFixed(0)} ms`;
      console.log('[shot] art generated', genMs.toFixed(1), 'ms,', art.sprites.length, 'sprites,', frames, 'frames');
      {
        // coverage of both sprite contracts and the debuff HUD icons
        const have = new Set(art.sprites.map((s) => s.id));
        const missing = [...REQUIRED_SPRITES, ...NEW_REQUIRED_SPRITES].filter((id) => !have.has(id));
        const missingIcons = DEBUFF_ICON_IDS.filter((id) => !iconPixels(id));
        const el = document.getElementById('coverage');
        const n = REQUIRED_SPRITES.length + NEW_REQUIRED_SPRITES.length;
        el.className = `meta ${missing.length || missingIcons.length ? 'bad' : 'ok'}`;
        el.textContent = missing.length || missingIcons.length
          ? `missing: ${[...missing, ...missingIcons].join(', ')}`
          : `coverage ok · ${n} required sprite ids · ${DEBUFF_ICON_IDS.length} debuff icons`;
        console.log('[shot] coverage', missing.length + missingIcons.length ? `MISSING ${[...missing, ...missingIcons].join(',')}` : 'ok');
      }

      const params = new URLSearchParams(location.search);
      const view = (params.get('view') ?? 'all').split(',');
      const show = (name) => view.includes('all') || view.includes(name);
      const litBox = document.getElementById('lit');
      litBox.checked = params.get('lit') === '1';

      const byPrefix = (p) => art.sprites.filter((s) => s.id.startsWith(p));
      const spriteIndex = new Map(art.sprites.map((s) => [s.id, s]));
      const byId = (id) => spriteIndex.get(id);
      const FORGE_MONSTERS = [...THEME_ROSTER.ashenForge.family, THEME_ROSTER.ashenForge.lieutenant, THEME_ROSTER.ashenForge.boss];

      // --- frame canvases (1x), both plain and "lit" (ambient-darkened colour + emissive glow) ---
      const AMBIENT = 0.3;
      function toCanvas(img, emissive, lit) {
        const c = document.createElement('canvas');
        c.width = img.width;
        c.height = img.height;
        const ctx = c.getContext('2d');
        const out = ctx.createImageData(img.width, img.height);
        for (let i = 0; i < img.data.length; i += 4) {
          let r = img.data[i], g = img.data[i + 1], b = img.data[i + 2];
          const a = img.data[i + 3];
          if (lit) {
            const e = emissive ? emissive.data[i + 3] / 255 : 0;
            const er = emissive ? emissive.data[i] : 0, eg = emissive ? emissive.data[i + 1] : 0, eb = emissive ? emissive.data[i + 2] : 0;
            r = r * AMBIENT * (1 - e) + er * e;
            g = g * AMBIENT * (1 - e) + eg * e;
            b = b * AMBIENT * (1 - e) + eb * e;
          }
          out.data[i] = r; out.data[i + 1] = g; out.data[i + 2] = b; out.data[i + 3] = a;
        }
        ctx.putImageData(out, 0, 0);
        return c;
      }
      const cache = new Map();
      function frameCanvases(sprite, lit) {
        const key = sprite.id + (lit ? '#lit' : '');
        if (!cache.has(key)) cache.set(key, sprite.frames.map((f, i) => toCanvas(f, sprite.emissive?.[i], lit)));
        return cache.get(key);
      }

      // --- animated sprite cards ---
      const animated = [];
      function spriteCard(sprite, scale, opts = {}) {
        const card = document.createElement('div');
        card.className = 'card';
        const canvas = document.createElement('canvas');
        const allFrames = opts.allFrames ?? sprite.fps === 0;
        const n = sprite.frames.length;
        const w = allFrames ? n * (sprite.width + 2) - 2 : sprite.width;
        canvas.width = w * scale;
        canvas.height = sprite.height * scale;
        card.append(canvas);
        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = opts.label ?? sprite.id.split('/').slice(1).join('/');
        const sub = document.createElement('div');
        sub.className = 'sub';
        sub.textContent = `${sprite.width}×${sprite.height} · ${n}f${sprite.fps ? ` @${sprite.fps}` : ''}${sprite.loop ? ' loop' : ''}${sprite.emissive ? ' · glow' : ''}`;
        card.append(label, sub);
        animated.push({ sprite, canvas, scale, allFrames, strip: opts.strip === true });
        return card;
      }

      function section(title) {
        const h = document.createElement('h2');
        h.textContent = title;
        app.append(h);
        const grid = document.createElement('div');
        grid.className = 'grid';
        app.append(grid);
        return grid;
      }

      const hash = (x, y, s) => {
        let h = (Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(s + 1, 982451653)) >>> 0;
        h = Math.imul(h ^ (h >>> 15), 2246822519) >>> 0;
        h = Math.imul(h ^ (h >>> 13), 3266489917) >>> 0;
        return (h ^ (h >>> 16)) >>> 0;
      };

      // =====================================================================================================
      // Gameplay scene: everything composed at 1x on a virtual screen, lit like the game, shown at 3x.
      // =====================================================================================================
      const VW = 400, VH = 225;
      const scenes = [];
      function buildScene(theme) {
        const rnd = (() => { let s = hash(theme.length, 7, 3); return () => ((s = hash(s, 11, 5)) % 10000) / 10000; })();
        const actors = [];
        const add = (id, x, y, o = {}) => actors.push({ id, x, y, flip: false, phase: rnd() * 10, light: 0, ...o });
        const px = VW / 2, py = VH / 2 + 10;
        // each theme fights its own roster (the hideout shows the forge's)
        const R = THEME_ROSTER[theme] ?? THEME_ROSTER.ashenForge;
        const [swarm, second, artillery, fourth, bruiser] = R.family;
        const hostileProj = { ashenForge: ['proj/cinderSpit', 'proj/heraldOrb'], rimedOssuary: ['proj/webShot', 'proj/frostShard'], ironColiseum: ['proj/crossbowBolt', 'proj/tarGlob'] }[theme] ?? ['proj/cinderSpit', 'proj/heraldOrb'];
        const decals = { rimedOssuary: [['fx/web', px - 96, py + 56], ['fx/iceSpike', px + 64, py - 40]], ironColiseum: [['fx/tarPool', px - 92, py + 52], ['fx/arenaSpike', px + 60, py - 40]] }[theme] ?? [];
        for (const [id, x, y] of decals) add(id, x, y, { decal: id === 'fx/web' || id === 'fx/tarPool' });
        add('sorceress/run/east', px, py, { light: 1 });
        add('proj/emberLance', px + 44, py - 14, { proj: true, light: 0.5 });
        add('proj/emberLance', px + 90, py - 16, { proj: true, light: 0.5 });
        add(hostileProj[0], px - 70, py + 30, { proj: true, rot: 0.4, light: 0.3 });
        add(hostileProj[1], px - 110, py - 30, { proj: true, light: 0.3 });
        const ring = (id, n, r0, r1) => {
          for (let i = 0; i < n; i++) {
            const a = rnd() * Math.PI * 2;
            const r = r0 + rnd() * (r1 - r0);
            const x = px + Math.cos(a) * r * 1.5;
            const y = py + Math.sin(a) * r;
            if (x < 8 || x > VW - 8 || y < 34 || y > VH - 4) continue;
            add(id, x, y, { flip: x > px });
          }
        };
        ring(`monster/${swarm}/move`, 34, 40, 110);
        ring(`monster/${second}/move`, 14, 36, 110);
        add(`monster/${artillery}/idle`, px + 150, py - 50, { flip: true });
        add(`monster/${artillery}/windup`, px - 150, py + 60);
        add(`monster/${fourth}/windup`, px + 70, py + 60, { flip: true });
        add(`monster/${bruiser}/move`, px - 60, py - 58);
        add(`monster/${bruiser}/windup`, px + 115, py + 20, { flip: true });
        add(`monster/${R.lieutenant}/idle`, px - 140, py - 20);
        if (theme !== 'hideout') add(`monster/${R.boss}/idle`, px + 150, py + 88, { flip: true, light: theme === 'rimedOssuary' ? 0.5 : 0 });
        add('drop/currency', px - 30, py + 40, { light: 0.25 });
        add('drop/equipment', px + 26, py + 52, { light: 0.25 });
        add('drop/map', px - 90, py + 70, { light: 0.25 });
        // props along the ruined rim and scattered
        const props = {
          hideout: [['prop/brazier', 60, 70], ['prop/standingStone', 330, 64], ['prop/banner', 250, 50], ['prop/rubble', 120, 200], ['prop/bones', 300, 190]],
          ashenForge: [['prop/brazier', 70, 72], ['prop/pillar', 330, 70], ['prop/rubble', 120, 205], ['prop/brazier', 280, 205], ['prop/bones', 30, 150]],
          rimedOssuary: [['prop/crystal', 60, 80], ['prop/pillar', 330, 70], ['prop/bones', 120, 205], ['prop/crystal', 290, 210], ['prop/standingStone', 30, 170]],
          ironColiseum: [['prop/ruinWall', 90, 56], ['prop/brazier', 330, 72], ['prop/pillar', 120, 205], ['prop/rubble', 290, 208], ['prop/banner', 30, 150]],
        }[theme];
        for (const [id, x, y] of props) add(id, x, y, { light: id === 'prop/brazier' ? 1.2 : id === 'prop/crystal' ? 0.6 : 0, prop: true });
        const card = document.createElement('div');
        card.className = 'card scene';
        const c = document.createElement('canvas');
        c.width = VW; c.height = VH;
        const zoom = Number(params.get('zoom') ?? 3);
        c.style.width = `${VW * zoom}px`; c.style.height = `${VH * zoom}px`;
        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = `${theme} · gameplay scene at ${zoom}×`;
        card.append(c, label);
        return { theme, canvas: c, card, actors };
      }

      // colour + emissive compositing on raw buffers
      function blit(buf, ebuf, img, emis, x0, y0, flip) {
        const w = img.width, h = img.height;
        for (let y = 0; y < h; y++) {
          const ty = y0 + y;
          if (ty < 0 || ty >= VH) continue;
          for (let x = 0; x < w; x++) {
            const tx = x0 + x;
            if (tx < 0 || tx >= VW) continue;
            const sx = flip ? w - 1 - x : x;
            const si = (y * w + sx) * 4;
            const a = img.data[si + 3] / 255;
            if (a <= 0) continue;
            const di = (ty * VW + tx) * 4;
            for (let k = 0; k < 3; k++) buf[di + k] = img.data[si + k] * a + buf[di + k] * (1 - a);
            buf[di + 3] = 255;
            if (emis) {
              const ea = emis.data[si + 3] / 255;
              for (let k = 0; k < 3; k++) ebuf[di + k] = Math.max(ebuf[di + k] * (1 - a), emis.data[si + k] * ea);
            } else if (a >= 1) {
              ebuf[di] = ebuf[di + 1] = ebuf[di + 2] = 0;
            }
          }
        }
      }
      function frameAt(s, t, phase) {
        if (s.fps === 0) return 0;
        const i = Math.floor((t + phase) * s.fps);
        return s.loop ? i % s.frames.length : Math.min(s.frames.length - 1, i % (s.frames.length + 6));
      }
      function renderScene(sc, t, lit) {
        const buf = new Float32Array(VW * VH * 4);
        const ebuf = new Float32Array(VW * VH * 4);
        const cols = Math.ceil(VW / 16), rows = Math.ceil(VH / 16);
        const floor = byId(`tile/${sc.theme}/floor`), detail = byId(`tile/${sc.theme}/detail`), edge = byId(`tile/${sc.theme}/edge`);
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (r === 0) { const k = hash(c, r, 1) % edge.frames.length; blit(buf, ebuf, edge.frames[k], edge.emissive?.[k], c * 16, 16, false); continue; }
            const k = hash(c, r, 2) % floor.frames.length;
            blit(buf, ebuf, floor.frames[k], floor.emissive?.[k], c * 16, (r + 1) * 16, false);
          }
        }
        for (let r = 1; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (hash(c, r, 3) % 100 >= 9) continue;
            const k = hash(c, r, 4) % detail.frames.length;
            blit(buf, ebuf, detail.frames[k], detail.emissive?.[k], c * 16, (r + 1) * 16, false);
          }
        }
        for (const a of sc.actors) {
          if (!a.decal) continue;
          const s = byId(a.id);
          blit(buf, ebuf, s.frames[0], s.emissive?.[0], Math.round(a.x - s.anchorX), Math.round(a.y - s.anchorY), false);
        }
        const sorted = [...sc.actors].filter((a) => !a.decal).sort((a, b) => a.y - b.y);
        for (const a of sorted) {
          const s = byId(a.id);
          if (!s || a.proj || a.prop || a.id.startsWith('fx/')) continue;
          // blob shadow under the feet (rough stand-in for the presenter's)
          const sw = Math.max(8, s.width * 0.55);
          for (let y = -2; y <= 2; y++) for (let x = -sw / 2; x <= sw / 2; x++) {
            const tx = Math.round(a.x + x), ty = Math.round(a.y + y - 1);
            if (tx < 0 || ty < 0 || tx >= VW || ty >= VH) continue;
            if ((x / (sw / 2)) ** 2 + (y / 2.4) ** 2 > 1) continue;
            const di = (ty * VW + tx) * 4;
            for (let k = 0; k < 3; k++) buf[di + k] *= 0.55;
          }
        }
        for (const a of sorted) {
          const s = byId(a.id);
          if (!s) continue;
          const f = frameAt(s, t, a.phase);
          const ax = a.flip ? s.width - s.anchorX : s.anchorX;
          blit(buf, ebuf, s.frames[f], s.emissive?.[f], Math.round(a.x - ax), Math.round(a.y - s.anchorY), a.flip);
        }
        const out = sc.canvas.getContext('2d').createImageData(VW, VH);
        // light map
        const lights = sorted.filter((a) => a.light > 0).map((a) => {
          const s = byId(a.id);
          const cold = a.id.includes('crystal') || a.id.includes('hollowWarden') || a.id.includes('frost') || a.id.includes('webShot');
          return { x: a.x, y: a.y - (a.proj ? 0 : s.height * 0.6), r: 34 + 70 * a.light, k: a.light, col: cold ? [0.55, 0.8, 1] : [1, 0.62, 0.32] };
        });
        // cheap bloom: box-blurred emissive
        const bloom = new Float32Array(VW * VH * 3);
        if (lit) {
          const R = 3;
          for (let y = 0; y < VH; y++) for (let x = 0; x < VW; x++) {
            let r = 0, g = 0, b = 0, n = 0;
            for (let dy = -R; dy <= R; dy += 1) for (let dx = -R; dx <= R; dx += 1) {
              const tx = x + dx, ty = y + dy;
              if (tx < 0 || ty < 0 || tx >= VW || ty >= VH) continue;
              const i = (ty * VW + tx) * 4;
              r += ebuf[i]; g += ebuf[i + 1]; b += ebuf[i + 2]; n++;
            }
            const o = (y * VW + x) * 3;
            bloom[o] = r / n; bloom[o + 1] = g / n; bloom[o + 2] = b / n;
          }
        }
        for (let y = 0; y < VH; y++) for (let x = 0; x < VW; x++) {
          const i = (y * VW + x) * 4;
          let r = buf[i], g = buf[i + 1], b = buf[i + 2];
          if (lit) {
            let lr = 0.22, lg = 0.2, lb = 0.24;
            for (const L of lights) {
              const d = Math.hypot(x - L.x, (y - L.y) * 1.3) / L.r;
              if (d >= 1) continue;
              const k = (1 - d) * (1 - d) * 1.4 * L.k;
              lr += k * L.col[0]; lg += k * L.col[1]; lb += k * L.col[2];
            }

        h.textContent = `Debuff HUD icons · ${DEBUFF_ICON_IDS.length} (32 px source) — HUD strip at 24 px, then 32 px and 64 px`;
        app.append(h);
        const hud = document.createElement('div');
        hud.className = 'hud';
        const secs = [1.4, 0.8, 1.4, 2.6, 3.1, 1.2, 3.8];
        DEBUFF_ICON_IDS.forEach((id, i) => {
          const b = document.createElement('div');
          b.className = 'buff';
          const img = document.createElement('img');
          img.src = art.icon(id, 24);
          img.alt = id;
          img.style.cssText = 'width:24px;height:24px';
          const tm = document.createElement('div');
          tm.className = 'sub';
          tm.textContent = `${secs[i].toFixed(1)}s`;
          b.append(img, tm);
          hud.append(b);
        });
        app.append(hud);
        const row = document.createElement('div');
        row.className = 'icons';
        row.style.marginTop = '10px';
        app.append(row);
        for (const id of DEBUFF_ICON_IDS) {
          const card = document.createElement('div');
          card.className = 'card';
          const r = document.createElement('div');
          r.className = 'row';
          for (const size of [32, 64]) {
            const img = document.createElement('img');
            img.src = art.icon(id, size);
            img.style.cssText = `width:${size}px;height:${size}px`;
            r.append(img);
          }
          const label = document.createElement('div');
          label.className = 'label';
          label.textContent = id.split('/').slice(1).join('/');
          card.append(r, label);
          row.append(card);
        }
      }
      if (show('proj')) {
        const pg = section('Projectiles (east-facing, centre anchored) — the bestiary ones are under bfx');
        for (const s of byPrefix('proj/')) if (!NEW_FX.has(s.id)) pg.append(spriteCard(s, 4));
      }
      if (show('fx')) {
        const fg = section('FX (centre anchored) — the bestiary ones are under bfx');
        for (const s of byPrefix('fx/')) if (!NEW_FX.has(s.id)) fg.append(spriteCard(s, 4, { allFrames: s.id === 'fx/scorch' || s.id === 'fx/blood' }));
      }
      if (show('props')) {
        const prg = section('Props (bottom-centre anchored)');
        const pWant = params.get('prop')?.split(',');
        for (const s of byPrefix('prop/')) if (!pWant || pWant.some((w) => s.id.includes(w))) prg.append(spriteCard(s, Number(params.get('pscale') ?? 4), { allFrames: s.fps === 0 }));
      }
      if (show('drops')) {
        const dg = section('Ground drops');
        for (const s of byPrefix('drop/')) dg.append(spriteCard(s, 4));
      }

      // Tiles: a tiled floor per theme with sparse details and a crumbling edge row
      const tileViews = [];
      if (show('tiles')) {
        const th = document.createElement('h2');
        th.textContent = 'World tiles · random variants per cell + detail decals + edge row (top: every variant side by side)';
        app.append(th);
        const floors = document.createElement('div');
        floors.className = 'floors';
        app.append(floors);
        for (const theme of ['hideout', 'ashenForge', 'rimedOssuary', 'ironColiseum']) {
          const card = document.createElement('div');
          card.className = 'card';
          const c = document.createElement('canvas');
          const cols = 20, rows = 11;
          c.width = cols * 16;
          c.height = rows * 16;
          card.append(c);
          const label = document.createElement('div');
          label.className = 'label';
          label.textContent = theme;
          card.append(label);
          floors.append(card);
          tileViews.push({ theme, canvas: c, cols, rows });
        }
      }
      function drawTiles(lit) {
        for (const { theme, canvas, cols, rows } of tileViews) {
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#060507';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          const floor = frameCanvases(byId(`tile/${theme}/floor`), lit);
          const detail = frameCanvases(byId(`tile/${theme}/detail`), lit);
          const edge = frameCanvases(byId(`tile/${theme}/edge`), lit);
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              if (r === 0) { if (c < 8) ctx.drawImage(floor[c], c * 17, 0); else if (c >= 11 && c < 19) ctx.drawImage(detail[c - 11], (c - 11) * 17 + 150, 0); continue; }
              if (r === rows - 1) { ctx.drawImage(edge[hash(c, r, 1) % edge.length], c * 16, r * 16); continue; }
              ctx.drawImage(floor[hash(c, r, 2) % floor.length], c * 16, r * 16);
              if (hash(c, r, 3) % 100 < 9) ctx.drawImage(detail[hash(c, r, 4) % detail.length], c * 16, r * 16);
            }
          }
        }
      }

      // Icons: inventory-style slots at 2× (64 px per grid cell), each at its own footprint
      if (show('icons')) {
        const ih = document.createElement('h2');
        ih.textContent = `Icons · ${ALL_ICON_IDS.length + DEBUFF_ICON_IDS.length} (32 px per grid cell source at the item's footprint, shown at ${32 * Number(params.get('iscale') ?? 2)} px per cell, with a 1× preview)`;
        app.append(ih);
        const icons = document.createElement('div');
        icons.className = 'icons';
        app.append(icons);
        const iscale = Number(params.get('iscale') ?? 2);
        const only = params.get('icons');
        for (const id of [...ALL_ICON_IDS, ...DEBUFF_ICON_IDS]) {
          if (only && !only.split(',').some((p) => id.includes(p))) continue;
          const px = iconPixels(id);
          const card = document.createElement('div');
          card.className = 'card';
          const slot = document.createElement('div');
          slot.className = 'slot';
          const img = document.createElement('img');
          img.src = art.icon(id, 32 * iscale);
          img.alt = id;
          img.style.width = `${px.width * iscale}px`;
          img.style.height = `${px.height * iscale}px`;
          slot.style.backgroundSize = `${32 * iscale}px ${32 * iscale}px, ${32 * iscale}px ${32 * iscale}px, auto`;
          slot.append(img);
          const small = document.createElement('img');
          small.src = art.icon(id, 32);
          small.style.cssText = `width:${px.width}px;height:${px.height}px;image-rendering:pixelated`;
          const row = document.createElement('div');
          row.className = 'row';
          row.style.alignItems = 'flex-end';
          row.append(slot, small);
          const label = document.createElement('div');
          label.className = 'label';
          label.textContent = id.split('/').slice(1).join('/');
          card.append(row, label);
          icons.append(card);
        }
      }

      if (show('portrait')) {
        const ph = document.createElement('h2');
        ph.textContent = 'Portrait (64×64, shown at 4×)';
        app.append(ph);
        const prow = document.createElement('div');
        prow.className = 'row';
        app.append(prow);
        const pimg = document.createElement('img');
        pimg.src = art.portrait(256);
        pimg.style.cssText = 'width:256px;height:256px;image-rendering:pixelated;border:1px solid #2c2428';
        const psmall = document.createElement('img');
        psmall.src = art.portrait(64);
        psmall.style.cssText = 'width:64px;height:64px;image-rendering:pixelated;border:1px solid #2c2428';
        prow.append(pimg, psmall);
      }

      // --- animation loop ---
      const start = performance.now();
      let lastScene = -1;
      function tick() {
        const t = (performance.now() - start) / 1000;
        const lit = litBox.checked;
        for (const a of animated) {
          const { sprite, canvas, scale, allFrames } = a;
          const ctx = canvas.getContext('2d');
          ctx.imageSmoothingEnabled = false;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          if (lit) { ctx.fillStyle = '#0a080b'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
          const fr = frameCanvases(sprite, lit);
          if (allFrames) {
            fr.forEach((f, i) => ctx.drawImage(f, i * (sprite.width + 2) * scale, 0, sprite.width * scale, sprite.height * scale));
          } else {
            const n = fr.length;
            let i;
            if (sprite.loop) i = Math.floor(t * sprite.fps) % n;
            else {
              // play once, hold the last frame, repeat
              const hold = Math.max(4, Math.round(sprite.fps * 0.6));
              i = Math.min(n - 1, Math.floor(t * sprite.fps) % (n + hold));
            }
            ctx.drawImage(fr[i], 0, 0, sprite.width * scale, sprite.height * scale);
          }
          // anchor marker
          if (!allFrames) {
            ctx.fillStyle = 'rgba(122,162,255,0.55)';
            ctx.fillRect(sprite.anchorX * scale - scale, sprite.anchorY * scale, scale * 2, 1);
          }
        }
        for (const fn of customAnims) fn(t, lit);
        // scenes are expensive-ish: update at ~12 Hz (the lineups at 6 Hz, or once when frozen with ?lf=)
        const st = Math.floor(t * 12);
        if (st !== lastScene) {
          lastScene = st;
          for (const sc of scenes) renderScene(sc, t, lit);
          for (const L of lineups) if ((L.lf === null && st % 2 === 0) || !L.drawn) { renderLineup(L, t); L.drawn = true; }
        }
        requestAnimationFrame(tick);
      }
      litBox.addEventListener('change', () => drawTiles(litBox.checked));
      drawTiles(litBox.checked);
      tick();
    </script>
  </body>
</html>
