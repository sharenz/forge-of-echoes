<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sound Forge · Forge of Echoes</title>
    <style>
      :root {
        /* Shared UI type scale (AGENTS.md) */
        --font-ui-caption: 14px;
        --font-ui-secondary: 16px;
        --font-ui-body: 19px;
        --font-ui-title: 28px;

        --ink: #0d0b0e;
        --coal: #1a1619;
        --char: #2a2326;
        --iron: #3b3438;
        --stone: #5a5057;
        --stone-light: #7d7278;
        --bone: #cbbfa8;
        --parchment: #e8dcc0;
        --moss: #4b5a3a;
        --olive: #6e7447;
        --olive-bright: #9aa35f;
        --rust: #7a3b24;
        --rust-bright: #c0643a;
        --ice: #d4f1ff;
        --blood: #7a1e22;
        --blood-bright: #c24a3e;
        --burgundy: #5a1a2a;
        --burgundy-bright: #b0506c;
        --ochre: #b8862f;
        --gold: #e0b04a;
        --ember: #e8662a;
        --flame: #ff9a3c;
        --hot: #ffe7a8;
        --frost: #7fc6e8;
        --void-glow: #c07bff;
        --rare: #f2d15c;
      }
      .ui-type-caption { font-size: var(--font-ui-caption); line-height: 1.3; }
      .ui-type-secondary { font-size: var(--font-ui-secondary); line-height: 1.35; }
      .ui-type-body { font-size: var(--font-ui-body); line-height: 1.3; }
      .ui-type-title { font-size: var(--font-ui-title); line-height: 1.15; }

      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        min-height: 100vh;
        color: var(--parchment);
        font-family: 'Alegreya Sans', system-ui, sans-serif;
        font-size: var(--font-ui-secondary);
        background:
          radial-gradient(ellipse 70% 45% at 50% 115%, rgba(232, 102, 42, 0.16), transparent 70%),
          radial-gradient(ellipse 45% 40% at 0% 0%, rgba(123, 63, 160, 0.09), transparent 70%),
          var(--ink);
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.012) 0 1px, transparent 1px 3px);
      }
      button { font-family: inherit; color: inherit; cursor: pointer; }
      .muted { color: var(--stone-light); }
      .hidden { display: none !important; }

      /* Header ------------------------------------------------------------ */
      header.top {
        position: sticky;
        top: 0;
        z-index: 2;
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 24px;
        padding: 12px 24px;
        border-bottom: 1px solid var(--iron);
        background: linear-gradient(180deg, #1d181b, #141114);
        box-shadow: 0 1px 0 rgba(224, 176, 74, 0.14), 0 12px 30px rgba(0, 0, 0, 0.55);
      }
      .brand { display: flex; gap: 14px; align-items: center; }
      h1 {
        margin: 0;
        font-family: 'Cinzel', serif;
        font-weight: 600;
        letter-spacing: 0.07em;
        color: var(--hot);
        text-shadow: 0 0 18px rgba(232, 102, 42, 0.45);
      }
      .sigil { width: 44px; height: 44px; fill: none; stroke: var(--ember); stroke-width: 1.6; filter: drop-shadow(0 0 6px rgba(232, 102, 42, 0.75)); }
      .sigil circle { stroke: var(--ochre); stroke-width: 1; opacity: 0.55; }
      .spectrum { justify-self: center; width: 360px; height: 56px; opacity: 0.95; }
      .status { display: flex; gap: 12px; align-items: center; }
      .pill {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 6px 12px;
        border: 1px solid var(--iron);
        border-radius: 999px;
        background: #141114;
        color: var(--bone);
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--stone); }
      .dot.live { background: var(--flame); box-shadow: 0 0 10px var(--ember); }
      .wake, .action {
        padding: 8px 16px;
        font-family: 'Cinzel', serif;
        font-weight: 600;
        letter-spacing: 0.05em;
        color: var(--hot);
        background: linear-gradient(180deg, #8a3a1c, #5c2412);
        border: 1px solid var(--ember);
        border-radius: 2px;
        box-shadow: inset 0 1px 0 rgba(255, 231, 168, 0.25), 0 0 18px -6px var(--ember);
      }
      .wake:hover, .action:hover { box-shadow: inset 0 1px 0 rgba(255, 231, 168, 0.3), 0 0 22px -4px var(--flame); }
      .action { width: 100%; margin-top: 10px; }
      .action.on { background: linear-gradient(180deg, #5a1a2a, #3a1019); border-color: var(--blood-bright); }
      .action:disabled { opacity: 0.6; cursor: progress; }

      /* Layout -------------------------------------------------------------- */
      main.layout { display: grid; grid-template-columns: 330px 1fr; gap: 18px; padding: 18px 24px 32px; }
      .side { display: flex; flex-direction: column; gap: 14px; }
      .content { min-width: 0; }
      .card {
        position: relative;
        padding: 12px 14px 14px;
        background: linear-gradient(180deg, #1f1a1d 0%, #161215 100%);
        border: 1px solid var(--iron);
        border-radius: 3px;
        box-shadow: inset 0 1px 0 rgba(255, 231, 168, 0.04), 0 6px 18px rgba(0, 0, 0, 0.45);
      }
      .card::before {
        content: '';
        position: absolute;
        left: -1px;
        right: -1px;
        top: -1px;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        opacity: 0.8;
      }
      .card h2 {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 0 0 10px;
        font-family: 'Cinzel', serif;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--bone);
      }
      .card h2::before {
        content: '';
        width: 6px;
        height: 6px;
        transform: rotate(45deg);
        background: var(--accent);
        box-shadow: 0 0 8px var(--accent);
      }
      .count { margin-left: auto; font-family: 'Alegreya Sans', sans-serif; letter-spacing: 0; color: var(--stone-light); }

      /* SFX buttons ------------------------------------------------------- */
      .groups { columns: 3 272px; column-gap: 14px; }
      .groups .card { break-inside: avoid; margin-bottom: 14px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .sfx {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 1px;
        min-width: 0;
        padding: 6px 9px 8px;
        text-align: left;
        background: linear-gradient(180deg, #2a2326, #1c181b);
        border: 1px solid var(--iron);
        border-radius: 2px;
        box-shadow: inset 0 1px 0 rgba(255, 231, 168, 0.06), 0 1px 0 rgba(0, 0, 0, 0.6);
        overflow: hidden;
        transition: border-color 0.12s, box-shadow 0.12s, transform 0.06s;
      }
      .sfx:hover { border-color: var(--accent); box-shadow: inset 0 1px 0 rgba(255, 231, 168, 0.08), 0 0 14px -4px var(--accent); }
      .sfx:active { transform: translateY(1px); }
      .sfx .label { font-weight: 500; color: var(--parchment); white-space: nowrap; }
      .sfx .id { max-width: 100%; overflow: hidden; text-overflow: ellipsis; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--stone-light); }
      .sfx .lvl { position: absolute; left: 0; bottom: 0; height: 2px; width: var(--w, 0%); background: var(--accent); opacity: 0.75; transition: width 0.4s; }
      .sfx.flash { animation: flash 0.55s ease-out; }
      @keyframes flash {
        0% { border-color: var(--accent); box-shadow: 0 0 22px -2px var(--accent), inset 0 0 18px rgba(255, 231, 168, 0.18); }
        100% { border-color: var(--iron); }
      }

      /* Music / mix ----------------------------------------------------------- */
      .tracks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
      .track {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        padding: 7px 10px;
        text-align: left;
        background: linear-gradient(180deg, #2a2326, #1c181b);
        border: 1px solid var(--iron);
        border-radius: 2px;
      }
      .track:hover { border-color: var(--stone-light); }
      .track.on { border-color: var(--ember); box-shadow: 0 0 16px -4px var(--ember), inset 0 0 14px rgba(232, 102, 42, 0.14); }
      .track.silence { grid-column: span 2; flex-direction: row; gap: 10px; align-items: baseline; }
      .theme-head { margin: 0 0 6px; letter-spacing: 0.06em; text-transform: uppercase; }
      .tracks.themes { grid-template-columns: repeat(3, 1fr); }
      .tracks.themes .track { padding: 6px 8px; }
      .row { display: grid; grid-template-columns: 70px 1fr 42px; align-items: center; gap: 10px; margin: 6px 0; }
      .row.tight { grid-template-columns: auto 1fr; margin-top: 8px; }
      .value { text-align: right; font-variant-numeric: tabular-nums; color: var(--hot); }
      input[type='range'] {
        -webkit-appearance: none;
        appearance: none;
        height: 4px;
        border-radius: 2px;
        background: linear-gradient(90deg, var(--ember) 0 var(--p, 50%), var(--iron) var(--p, 50%));
      }
      input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 12px;
        height: 12px;
        border: 2px solid var(--ember);
        border-radius: 1px;
        background: var(--hot);
        transform: rotate(45deg);
        box-shadow: 0 0 8px var(--ember);
      }
      input[type='checkbox'] { accent-color: var(--ember); }
      .pad, .meter { display: block; width: 100%; }
      .pad {
        height: auto;
        background: radial-gradient(circle at 50% 50%, #221c20, #121013 70%);
        border: 1px solid var(--iron);
        border-radius: 2px;
        cursor: crosshair;
      }
      .stats { margin-top: 8px; color: var(--stone-light); font-variant-numeric: tabular-nums; }

      /* Inspector ------------------------------------------------------------- */
      .inspector { margin-bottom: 14px; }
      .inspector .levels-head { margin-bottom: 10px; }
      .inspector .levels-head > span { flex: 1; }
      .inspector .row.tight { margin: 0; gap: 6px; }
      .inspect { display: block; width: 100%; height: 190px; border: 1px solid var(--iron); border-radius: 2px; background: var(--ink); image-rendering: auto; }
      .inspect-meta { margin-top: 6px; font-variant-numeric: tabular-nums; }
      .atlas {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        align-content: start;
        gap: 8px;
        padding: 10px;
        overflow: auto;
        background: var(--ink);
      }
      .atlas.wide { grid-template-columns: 1fr; }
      .atlas figure { margin: 0; }
      .atlas canvas { display: block; width: 100%; border: 1px solid var(--iron); }
      .atlas figcaption { padding: 2px 0; color: var(--bone); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      /* Levels ---------------------------------------------------------------- */
      .levels { margin-top: 0; }
      .levels-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .levels-head h2 { margin: 0; }
      .levels-head .action { width: auto; margin: 0; }
      .btns { display: flex; gap: 8px; }
      .action.ghost { background: linear-gradient(180deg, #2a2326, #1c181b); border-color: var(--iron); color: var(--bone); box-shadow: none; }
      .action.ghost:hover { border-color: var(--stone-light); }
      .music-levels { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 10px; }
      .music-levels:empty { display: none; }
      .chip { padding: 3px 9px; border: 1px solid var(--iron); border-radius: 999px; background: #151215; font-variant-numeric: tabular-nums; }
      .chip b { font-weight: 500; color: var(--hot); }
      .calib { max-height: 260px; overflow: auto; margin: 0 0 12px; padding: 10px 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--bone); background: #121013; border: 1px solid var(--iron); border-radius: 2px; }
      .levels p { margin: 8px 0 10px; }
      table { width: 100%; border-collapse: collapse; }
      th { padding: 6px 8px; font-weight: 500; text-align: left; letter-spacing: 0.06em; text-transform: uppercase; color: var(--stone-light); border-bottom: 1px solid var(--iron); }
      td { padding: 4px 8px; border-bottom: 1px solid #231e21; }
      tbody tr:hover td { background: rgba(255, 231, 168, 0.03); }
      td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
      .good { color: var(--olive-bright); }
      .warn { color: var(--flame); }
      .bar { position: relative; display: inline-block; width: 90px; height: 6px; margin-right: 8px; vertical-align: middle; background: var(--char); }
      .bar .fill { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--ochre), var(--gold)); }
      .bar .target { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--hot); }
    </style>
  </head>
  <body>
    <div id="board"></div>
    <script type="module">
      import { mountSoundboard } from '/src/audio/dev/soundboard.ts';
      mountSoundboard(document.getElementById('board'));
    </script>
  </body>
</html>
