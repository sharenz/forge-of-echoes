name: crafty-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  game-server:
    image: crafty-game-server:${RELEASE_ID}
    build:
      context: ..
      dockerfile: Dockerfile.game-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "2567"
      GAME_SERVER_HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CRAFTY_AUTH_SECRET: ${CRAFTY_AUTH_SECRET}
      ALLOWED_ORIGINS: https://${APP_DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:2567/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    image: crafty-web:${RELEASE_ID}
    build:
      context: ..
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_GAME_SERVER_URL: https://${GAME_DOMAIN}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
    networks:
      - private
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      GAME_DOMAIN: ${GAME_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      game-server:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - private

networks:
  private:
    driver: bridge

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
